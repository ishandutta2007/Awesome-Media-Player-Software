<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)"/>

  <!-- Dynamic Animated Floating Waves / Pulses in Background -->
  <g opacity="0.35">
    <!-- Equalizer Bars Dynamic Animation -->
    <rect x="80" y="160" width="8" height="60" fill="#38bdf8" rx="4">
      <animate attributeName="height" values="40;90;30;70;40" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="170;120;180;140;170" dur="2.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="96" y="140" width="8" height="90" fill="#818cf8" rx="4">
      <animate attributeName="height" values="80;30;100;50;80" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="130;180;110;160;130" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="112" y="170" width="8" height="50" fill="#c084fc" rx="4">
      <animate attributeName="height" values="60;110;40;80;60" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="150;100;170;130;150" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="128" y="150" width="8" height="80" fill="#f43f5e" rx="4">
      <animate attributeName="height" values="90;40;70;110;90" dur="2.0s" repeatCount="indefinite"/>
      <animate attributeName="y" values="120;170;140;100;120" dur="2.0s" repeatCount="indefinite"/>
    </rect>
    <rect x="144" y="165" width="8" height="55" fill="#38bdf8" rx="4">
      <animate attributeName="height" values="50;85;35;95;50" dur="2.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="160;125;175;115;160" dur="2.1s" repeatCount="indefinite"/>
    </rect>

    <!-- Equalizer Right Side -->
    <rect x="1040" y="160" width="8" height="60" fill="#38bdf8" rx="4">
      <animate attributeName="height" values="50;95;35;85;50" dur="2.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="160;115;175;125;160" dur="2.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="1056" y="140" width="8" height="90" fill="#818cf8" rx="4">
      <animate attributeName="height" values="90;40;110;60;90" dur="1.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="120;170;100;150;120" dur="1.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="1072" y="170" width="8" height="50" fill="#c084fc" rx="4">
      <animate attributeName="height" values="40;100;50;80;40" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="170;110;160;130;170" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="1088" y="150" width="8" height="80" fill="#f43f5e" rx="4">
      <animate attributeName="height" values="80;30;95;45;80" dur="2.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="130;180;115;165;130" dur="2.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Glowing Orbiting Circles in Background -->
  <g opacity="0.25">
    <circle cx="250" cy="150" r="80" stroke="url(#accentGlow)" stroke-width="2" fill="none">
      <animateTransform attributeName="transform" type="rotate" from="0 250 150" to="360 250 150" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="950" cy="150" r="90" stroke="url(#titleGrad)" stroke-width="2" fill="none">
      <animateTransform attributeName="transform" type="rotate" from="360 950 150" to="0 950 150" dur="15s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Play Button Icon Center Accent (Background Glow) -->
  <g transform="translate(600, 75)" opacity="0.15">
    <polygon points="-30,-40 40,0 -30,40" fill="#ffffff" filter="url(#glow)">
      <animate attributeName="transform" type="scale" values="1;1.15;1" dur="3s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- Foreground Main Content (High Contrast & Legibility) -->
  <!-- Header Title -->
  <text x="600" y="125" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="46" fill="url(#titleGrad)" filter="url(#glow)" letter-spacing="1.5">
    Awesome Media Player Software
  </text>

  <!-- Subtitle -->
  <text x="600" y="175" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="20" fill="#e2e8f0" letter-spacing="0.5">
    🎬 Curated List of Top Media Players, Home Theater Centers &amp; Streaming Servers 🚀
  </text>

  <!-- Category Badges / Tags -->
  <g transform="translate(600, 225)" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
    <!-- Tag 1 -->
    <rect x="-260" y="-16" width="115" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="-202.5" y="3" fill="#38bdf8">▶ Local Playback</text>
    
    <!-- Tag 2 -->
    <rect x="-130" y="-16" width="115" height="28" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="-72.5" y="3" fill="#818cf8">📺 Home Theater</text>

    <!-- Tag 3 -->
    <rect x="0" y="-16" width="130" height="28" rx="14" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
    <text x="65" y="3" fill="#c084fc">📡 Media Servers</text>

    <!-- Tag 4 -->
    <rect x="145" y="-16" width="115" height="28" rx="14" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="202.5" y="3" fill="#f43f5e">⚡ Open Source</text>
  </g>
</svg>
